<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Parse Admin</title><link rel="stylesheet" href="./assets/style.css"></head>
<body>
<div class="ambient"></div>
<main class="shell">
<section id="login" class="login-card">
<div class="brand"><div class="logo">P</div><div><h1>Parse <span>Admin</span></h1><small>مدیریت پلتفرم آموزشی</small></div></div>
<p class="muted">برای ورود به پنل، با حساب مدیر وارد شوید.</p>
<form id="loginForm"><label>آدرس API<input id="api" type="url" placeholder="https://your-api.example.com" required></label><label>نام کاربری<input id="username" autocomplete="username" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">ورود به پنل</button><p id="loginError" class="error"></p></form>
</section>
<section id="dashboard" hidden>
<header class="top"><div class="brand"><div class="logo">P</div><div><h1>Parse <span>Admin</span></h1><small>داشبورد مدیریت</small></div></div><div class="top-actions"><span id="adminName" class="muted"></span><button id="logout" class="ghost">خروج</button></div></header>
<div class="welcome"><h2>داشبورد</h2><p class="muted">نمای کلی آمار پلتفرم</p></div>
<div class="cards"><article class="stat"><span>کاربران</span><strong id="users">—</strong><small>کل حساب‌های ثبت‌شده</small></article><article class="stat"><span>منابع آموزشی</span><strong id="sources">—</strong><small>کل منابع بارگذاری‌شده</small></article><article class="stat"><span>سؤالات</span><strong id="questions">—</strong><small>کل سؤالات تولیدشده</small></article></div>
<div class="panel"><div><h3>اتصال API</h3><p id="connection" class="muted">در حال بررسی…</p></div><button id="refresh" class="ghost">به‌روزرسانی آمار</button></div>
<footer>Parse Admin · مستقل از اپلیکیشن Flutter</footer>
</section>
</main><script src="./assets/app.js"></script></body></html>
