<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>Parse Admin</title><link rel="stylesheet" href="./assets/style.css"></head>
<body>
<main class="shell">
<section id="login" class="login-card">
<div class="brand"><h1>Parse <span>Admin</span></h1><small>مدیریت پلتفرم آموزشی</small></div>
<p class="muted">برای ورود به پنل، با حساب مدیر وارد شوید.</p>
<form id="loginForm"><label>نام کاربری / ایمیل<input id="username" autocomplete="username" value="admin@parse.local" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" value="ParseAdmin123!" required></label><button class="primary" type="submit">ورود</button><p id="loginError" class="error"></p></form>
</section>
<section id="dashboard" hidden>
<header class="top"><div class="brand"><h1>Parse <span>Admin</span></h1><small>داشبورد مدیریت</small></div><div class="top-actions"><span id="adminName" class="muted"></span><button id="logout" class="ghost">خروج</button></div></header>
<div class="welcome"><h2>داشبورد</h2><p class="muted">نمای کلی آمار پلتفرم</p></div>
<div class="cards"><article class="stat"><span>کاربران</span><strong id="users">—</strong><small>کل حساب‌های ثبت‌شده</small></article><article class="stat"><span>منابع آموزشی</span><strong id="sources">—</strong><small>کل منابع بارگذاری‌شده</small></article><article class="stat"><span>سؤالات</span><strong id="questions">—</strong><small>کل سؤالات ذخیره‌شده</small></article></div>
<div class="panel"><div><h3>وضعیت اتصال</h3><p id="connection" class="muted">—</p></div><button id="refresh" class="ghost">به‌روزرسانی</button></div>
<section class="settings"><h3>تنظیمات</h3><label>آدرس API<input id="api" type="url" placeholder="https://your-api.onrender.com"></label><button id="saveSettings" class="primary">ذخیره تنظیمات</button><p id="settingsMessage" class="muted"></p></section>
<footer>Parse Admin</footer>
</section>
</main><script src="./assets/app.js"></script></body></html>
