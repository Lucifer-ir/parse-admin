name: Backend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - name: PHP syntax check
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Installer syntax check
        run: bash -n install.sh && bash -n backend/bin/backup-db.sh
