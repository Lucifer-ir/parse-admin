name: PHP and AI console validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, sodium

      - name: PHP syntax check
        run: find app backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: node --check app/public/assets/admin.js

      - name: Shell syntax check
        run: bash -n install.sh && bash -n update-panel.sh && bash -n backend/bin/backup-db.sh
